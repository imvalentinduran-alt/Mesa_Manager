<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login — UPEL Mesa Manager</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">

<link rel="stylesheet" href="ui.css">

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  body { background: #050608; }
</style>
</head>
<body>
<div id="root"></div>

<script src="logo-paths.js"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="flow.jsx"></script>
<script type="text/babel" src="boot.jsx"></script>
<script type="text/babel" src="login.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "mode": "oscuro",
  "screen": "carga",
  "demoError": false
}/*EDITMODE-END*/;

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const dark = t.mode === 'oscuro';
  const [bootKey, setBootKey] = useState(0);

  // Cuando el usuario está en "boot", lo reproducimos en loop para que se vea la animación.
  return (
    <React.Fragment>
      {t.screen === 'login'
        ? <MMLogin dark={dark} demoError={t.demoError} />
        : <MMBoot key={bootKey} dark={dark} onDone={() => setBootKey(k => k + 1)} />}

      <TweaksPanel>
        <TweakSection label="Vista" />
        <TweakRadio label="Pantalla" value={t.screen}
          options={['login', 'carga']}
          onChange={(v) => setTweak('screen', v)} />
        <TweakRadio label="Modo" value={t.mode}
          options={['oscuro', 'claro']}
          onChange={(v) => setTweak('mode', v)} />
        <TweakSection label="Estados" />
        <TweakToggle label="Demo: error del servidor" value={t.demoError}
          onChange={(v) => setTweak('demoError', v)} />
      </TweaksPanel>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
